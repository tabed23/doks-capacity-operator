# This rule is not used by the project doks-capacity-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over platform.mahy.love.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: doks-capacity-operator
    app.kubernetes.io/managed-by: kustomize
  name: dokscapacityoperator-admin-role
rules:
- apiGroups:
  - platform.mahy.love
  resources:
  - dokscapacityoperators
  verbs:
  - '*'
- apiGroups:
  - platform.mahy.love
  resources:
  - dokscapacityoperators/status
  verbs:
  - get
