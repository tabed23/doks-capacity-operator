# Namespace first, so the namespaced resources below always have a home
# on the very first `kubectl apply -f release.yaml`.
apiVersion: v1
kind: Namespace
metadata:
  name: doks-system
  labels:
    app.kubernetes.io/name: doks-capacity-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: doks-capacity-operator
  labels:
    app.kubernetes.io/name: doks-capacity-operator
rules:
  - apiGroups: ["platform.mahy.love"]
    resources: ["dokscapacityoperators"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["platform.mahy.love"]
    resources: ["dokscapacityoperators/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["platform.mahy.love"]
    resources: ["dokscapacityoperators/finalizers"]
    verbs: ["update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: doks-capacity-operator
  labels:
    app.kubernetes.io/name: doks-capacity-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: doks-capacity-operator
subjects:
  - kind: ServiceAccount
    name: doks-capacity-operator
    namespace: doks-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: doks-capacity-operator
  namespace: doks-system
  labels:
    app.kubernetes.io/name: doks-capacity-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doks-capacity-operator
  namespace: doks-system
  labels:
    app.kubernetes.io/name: doks-capacity-operator
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: doks-capacity-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: doks-capacity-operator
        app.kubernetes.io/version: "0.1.0"
    spec:
      serviceAccountName: doks-capacity-operator
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: doks-capacity-operator:0.1.0
          imagePullPolicy: Always
          args:
            - "--health-probe-bind-address=:8081"
            - "--metrics-bind-address=:8080"
            - "--leader-elect=false"
          env:
            - name: DIGITALOCEAN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: doks-do-token
                  key: token
          ports:
            - name: health
              containerPort: 8081
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: doks-capacity-operator
  namespace: doks-system
  labels:
    app.kubernetes.io/name: doks-capacity-operator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: doks-capacity-operator

# 5. SealedSecret — generated by kubeseal, safe to commit
# To regenerate:
# kubectl create secret generic doks-do-token \
#  --from-literal=token="DO_TOKEN" \
#  --namespace doks-system \
#  --dry-run=client -o yaml \
# | kubeseal \
#  --controller-name sealed-secrets \
#   --controller-namespace  \
#  --namespace doks-system \
#  --name doks-do-token \
#  --format yaml > sealed-do-token.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: doks-do-token
  namespace: doks-system
spec:
  encryptedData:
    token:
  template:
    metadata:
      name: doks-do-token
      namespace: doks-system
    type: Opaque